name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Giải nén mã nguồn (nếu bạn upload dạng zip từ điện thoại)
        run: |
          if [ -f pharaoh-pyramid.zip ]; then
            rm -rf _tmp && unzip -o pharaoh-pyramid.zip -d _tmp
            cp -r _tmp/pharaoh-pyramid/. .
            rm -rf _tmp
          fi
      - name: Kiểm thử logic (kinh tế, khuôn, thùng, băng chuyền, xe đẩy, văng máy chạy)
        run: sh tests/run.sh
      - run: npm install
      - name: Đưa thư viện vào app (chạy được khi không có mạng CDN)
        run: |
          mkdir -p www/lib
          cp node_modules/three/build/three.module.js www/lib/
          cp node_modules/peerjs/dist/peerjs.min.js www/lib/
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#./lib/three.module.js#; s#https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js#lib/peerjs.min.js#' www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Quyền micro (voice chat) + khóa màn hình ngang
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PharaohsPyramid-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Đăng APK lên GitHub Releases (tải thẳng từ điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Pharaoh's Pyramid – APK mới nhất"
          body: "Bản build tự động từ nhánh main. Tải file app-debug.apk bên dưới rồi cài đặt."
          files: android/app/build/outputs/apk/debug/app-debug.apk
